<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Friendly Household - Sign In</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet" />
    <!-- Inter for login form -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ee5f2b",
                        "background-light": "#f8f6f6",
                        "auth-bg": "#fcfbfa", // The warm off-white from the mock
                    },
                    fontFamily: {
                        "display": ["Noto Serif", "serif"],
                        "sans": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .auth-gradient {
            background: radial-gradient(circle at top left, rgba(238, 95, 43, 0.05) 0%, transparent 40%),
                radial-gradient(circle at bottom right, rgba(0, 0, 0, 0.02) 0%, transparent 40%);
            background-color: #fcfbfa;
            /* auth-bg */
        }
    </style>
</head>

<body class="auth-gradient font-sans text-slate-900 min-h-screen flex flex-col selection:bg-primary/30">

    <!-- Minimal Header for Auth Area -->
    <header class="w-full px-8 py-6 flex justify-center md:justify-start">
        <a href="index.html" class="flex items-center gap-3 text-primary group">
            <div
                class="size-8 rounded-full bg-white shadow-sm flex items-center justify-center transform group-hover:scale-105 transition-transform">
                <span class="material-symbols-outlined text-xl">home_app_logo</span>
            </div>
            <h2 class="text-slate-900 text-xl font-bold leading-tight font-display tracking-tight">Friendly Household
            </h2>
        </a>
    </header>

    <!-- Main Content (Login Flow) -->
    <main class="flex-grow flex items-center justify-center p-4 py-12">

        <div
            class="bg-white p-10 md:p-12 rounded-[2.5rem] shadow-[0_20px_60px_rgba(0,0,0,0.04)] w-full max-w-[480px] border border-slate-100 flex flex-col items-center">

            <!-- Logo area -->
            <div class="w-16 h-16 bg-orange-50 rounded-2xl flex items-center justify-center text-primary mb-6 animate-pulse"
                style="animation-duration: 3s;">
                <span class="material-symbols-outlined text-3xl">home_app_logo</span>
            </div>

            <!-- Headers -->
            <div class="text-center mb-10 w-full">
                <h1 class="text-[32px] font-bold tracking-tight text-slate-900 mb-2">Welcome Back</h1>
                <p class="text-slate-500 text-[15px]">Sign in to continue your essential shopping.</p>
            </div>

            <!-- Form -->
            <form class="w-full space-y-5" action="index.html">
                <div class="space-y-2 group">
                    <label class="block text-[13px] font-semibold text-slate-900 px-1">Email address</label>
                    <div class="relative flex items-center">
                        <span
                            class="material-symbols-outlined absolute left-4 text-slate-400 group-focus-within:text-primary transition-colors text-lg">mail</span>
                        <input type="email"
                            class="w-full bg-white border border-slate-200 rounded-2xl py-4 pl-12 pr-4 text-[15px] focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-slate-400"
                            placeholder="hello@example.com" required>
                    </div>
                </div>

                <div class="space-y-2 group">
                    <div class="flex items-center justify-between px-1">
                        <label class="block text-[13px] font-semibold text-slate-900">Password</label>
                        <a href="#"
                            class="text-[13px] font-semibold text-primary hover:text-primary/80 transition-colors">Forgot
                            Password?</a>
                    </div>
                    <div class="relative flex items-center">
                        <span
                            class="material-symbols-outlined absolute left-4 text-slate-400 group-focus-within:text-primary transition-colors text-lg">lock</span>
                        <input type="password"
                            class="w-full bg-white border border-slate-200 rounded-2xl py-4 pl-12 pr-4 text-[15px] focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all placeholder:text-slate-400 tracking-widest"
                            placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-primary hover:bg-[#de5121] text-white font-semibold rounded-2xl py-4 transition-all shadow-[0_8px_20px_rgb(238,95,43,0.2)] hover:shadow-[0_8px_25px_rgb(238,95,43,0.3)] hover:-translate-y-0.5 mt-8 flex items-center justify-center gap-2">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
                </button>
            </form>

            <p class="mt-10 text-[14px] text-slate-500 text-center">
                Don't have an account? <a href="#" class="font-bold text-primary hover:underline">Sign up</a>
            </p>

        </div>
    </main>

</body>

</html>
