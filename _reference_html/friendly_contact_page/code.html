<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Friendly Contact Page</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec4913",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221510",
                        "pastel-blue": "#e6f0fa",
                        "neutral-beige": "#f4f1f0",
                        "soft-coral": "#ff7f50"
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-pastel-blue dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col antialiased">
<!-- Top Navigation Bar -->
<header class="bg-white/80 dark:bg-background-dark/80 backdrop-blur-md sticky top-0 z-50 border-b border-neutral-beige dark:border-white/10">
<div class="max-w-[1200px] mx-auto px-6 py-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-3xl">home_app_logo</span>
<h1 class="text-xl font-bold tracking-tight">Household Essentials</h1>
</div>
<nav class="hidden md:flex items-center gap-8">
<a class="text-sm font-medium hover:text-primary transition-colors" href="#">Shop</a>
<a class="text-sm font-medium hover:text-primary transition-colors" href="#">About</a>
<a class="text-sm font-medium text-primary" href="#">Contact Us</a>
</nav>
<div class="flex items-center gap-4">
<button class="bg-neutral-beige dark:bg-white/10 hover:bg-neutral-beige/80 dark:hover:bg-white/20 p-2.5 rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-xl">shopping_cart</span>
</button>
</div>
</div>
</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center py-20 px-4">
<div class="max-w-[640px] w-full bg-white dark:bg-background-dark/50 rounded-xl shadow-sm border border-neutral-beige dark:border-white/10 p-8 md:p-12">
<div class="text-center mb-10">
<h2 class="text-4xl font-black tracking-tight mb-4">Contact Us</h2>
<p class="text-slate-600 dark:text-slate-400 text-lg">We would love to hear from you. Please fill out the form below.</p>
</div>
<form class="space-y-6 flex flex-col">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<label class="flex flex-col gap-2">
<span class="text-sm font-bold text-slate-700 dark:text-slate-300">Name</span>
<input class="form-input rounded-full border-neutral-beige dark:border-white/20 bg-background-light dark:bg-black/20 focus:border-primary focus:ring-primary h-14 px-6 text-base w-full placeholder:text-slate-400 transition-colors" placeholder="Your Name" type="text"/>
</label>
<label class="flex flex-col gap-2">
<span class="text-sm font-bold text-slate-700 dark:text-slate-300">Email</span>
<input class="form-input rounded-full border-neutral-beige dark:border-white/20 bg-background-light dark:bg-black/20 focus:border-primary focus:ring-primary h-14 px-6 text-base w-full placeholder:text-slate-400 transition-colors" placeholder="your@email.com" type="email"/>
</label>
</div>
<label class="flex flex-col gap-2">
<span class="text-sm font-bold text-slate-700 dark:text-slate-300">Message</span>
<textarea class="form-textarea rounded-xl border-neutral-beige dark:border-white/20 bg-background-light dark:bg-black/20 focus:border-primary focus:ring-primary min-h-[160px] p-6 text-base w-full resize-y placeholder:text-slate-400 transition-colors" placeholder="How can we help you today?"></textarea>
</label>
<div class="pt-4 flex justify-center">
<button class="bg-primary hover:bg-primary/90 text-white font-bold py-4 px-10 rounded-full w-full md:w-auto transition-colors shadow-sm" type="button">
                        Send Message
                    </button>
</div>
</form>
</div>
</main>
<!-- Footer -->
<footer class="bg-neutral-beige dark:bg-black/40 py-12 mt-auto">
<div class="max-w-[1200px] mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-slate-400">local_florist</span>
<span class="text-sm text-slate-500 font-medium">© 2024 Household Essentials.</span>
</div>
<div class="flex items-center gap-6">
<a aria-label="Facebook" class="text-slate-400 hover:text-soft-coral transition-colors" href="#">
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"></path></svg>
</a>
<a aria-label="Twitter" class="text-slate-400 hover:text-soft-coral transition-colors" href="#">
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24"><path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"></path></svg>
</a>
<a aria-label="Instagram" class="text-slate-400 hover:text-soft-coral transition-colors" href="#">
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"></path></svg>
</a>
</div>
</div>
</footer>
</body></html>
